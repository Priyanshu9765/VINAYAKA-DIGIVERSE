services:
  - type: web
    name: vinayakadigiverse
    env: static
    staticPublishPath: .   # Use '.' if your index.html is in root
    headers:
      # ✅ Cache HTML only for 1 day (so updates show quickly)
      - path: /*
        name: Cache-Control
        value: public, max-age=86400

      # ✅ Cache images, CSS, JS, videos for 1 year
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
